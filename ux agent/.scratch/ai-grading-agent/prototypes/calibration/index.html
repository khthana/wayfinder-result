/* ============================================================

function cmCell(i,j){
  const v = CM[i][j];
  const p = (v/TOTAL*100);
  const d = Math.abs(i-j);
  const cls = d===0 ? "diag" : (d>=2 ? "far" : "");
  const alpha = v===0 ? 0 : Math.min(.85, .10 + v/62);
  const bg = d===0 ? `rgba(13,122,79,${alpha})` : (d>=2 ? `rgba(179,38,30,${alpha})` : `rgba(138,138,130,${alpha*.55})`);
  return `<td><div class="cell ${cls}" style="background:${bg}">
    <div class="n">${v||"·"}</div>${v?`<div class="p">${p.toFixed(0)}%</div>`:""}</div></td>`;
}

function confusion(){
  let rows = "";
  for(let i=0;i<4;i++){
    rows += `<tr><th>${LEVELS[i].n} · ${LEVELS[i].name}</th>` +
      [0,1,2,3].map(j=>cmCell(i,j)).join("") +
      `<th style="font-family:var(--mono);font-weight:500">${CM[i].reduce((a,b)=>a+b,0)}</th></tr>`;
  }
  const colSum = [0,1,2,3].map(j=>CM.reduce((s,r)=>s+r[j],0));
  return `
  <div style="overflow-x:auto">
   <div class="axl" style="margin-bottom:5px">คอลัมน์ = ระดับที่ <span style="color:var(--ai);font-weight:600">AI</span> ให้ &nbsp;·&nbsp; แถว = ระดับที่ <span style="color:var(--teacher);font-weight:600">อาจารย์</span> ให้</div>
   <div class="cm"><table>
    <tr><th></th>${LEVELS.map(l=>`<th>${l.n}<br><span style="font-weight:400">${l.name}</span></th>`).join("")}<th>รวม</th></tr>
    ${rows}
    <tr><th>รวม</th>${colSum.map(v=>`<th style="font-family:var(--mono);font-weight:500">${v}</th>`).join("")}
      <th style="font-family:var(--mono);font-weight:600">${TOTAL}</th></tr>
   </table></div>
   <div class="cmlegend">
     <span><span style="display:inline-block;width:11px;height:11px;background:var(--teacher);border-radius:2px;vertical-align:-1px"></span>
       แนวทแยง = ตรงกันพอดี · ${diag} จาก ${TOTAL}</span>
     <span><span style="display:inline-block;width:11px;height:11px;background:var(--danger);border-radius:2px;vertical-align:-1px"></span>

   </div>
  </div>`;
}

function ceilBars(){

        <div class="ceilmark" style="left:${ce}%" data-l="เพดาน ${unit==='%'?ce+'%':ce}"></div>
      </div>
      <div class="v">${unit==='%'?ai+'%':ai}</div>
    </div>`;
  return `<div class="ceil">
    ${row("ตรงกันพอดี", pctEx, CEIL.exact, '%')}
    ${row("คลาดไม่เกิน 1 ระดับ", pctNe, CEIL.near, '%')}
    <div class="ceilrow">
      <div class="k">QWK</div>
      <div class="track"><div class="fill ai" style="width:${AGG.qwk*100}%"></div>
        <div class="ceilmark" style="left:${CEIL.qwk*100}%" data-l="เพดาน ${CEIL.qwk.toFixed(2)}"></div></div>
      <div class="v">${AGG.qwk.toFixed(2)}</div>
    </div>
  </div>`;
}

function dotChart(){
  const sorted = [...CRIT].sort((a,b)=>a.qwk-b.qwk);
  return sorted.map(c=>{
    const ax = c.qwk*100, tx = c.ceil*100;
    const gap = c.ceil-c.qwk;
    const flag = gap>=.25 ? `<span class="tag d">ห่างเพดานมาก</span>`
              : gap>=.13 ? `<span class="tag w">ยังห่าง</span>`
              : `<span class="tag t">ใกล้เพดาน</span>`;
    return `<div class="dot" data-a="crit" data-x="${c.id}" style="cursor:pointer">
      <div class="name"><span class="id">${c.id}</span>${esc(c.name)}
        <div style="font-size:11px;color:var(--ink-3)">n=${c.n} · ตรงพอดี ${c.exact}% · ±1 ระดับ ${c.near}%</div></div>
      <div>
        <div class="lane">
          <div class="axis"></div>
          <div class="gap" style="left:${Math.min(ax,tx)}%;width:${Math.abs(tx-ax)}%"></div>
          <div class="pt ai" style="left:${ax}%" title="AI ${c.qwk.toFixed(2)}"></div>
          <div class="pt t" style="left:${tx}%" title="เพดานมนุษย์ ${c.ceil.toFixed(2)}"></div>
        </div>
      </div>
      <div class="num">${c.qwk.toFixed(2)} <span style="color:var(--ink-3)">/ ${c.ceil.toFixed(2)}</span></div>
      <div class="flag">${flag}</div>
    </div>`;
  }).join("");
}

function vCriterion(){
  const c = C(S.crit);
  const rows = OUTLIERS.filter(o=>o.c===c.id);
  const dir = c.bias > .15 ? "สูงกว่า" : c.bias < -.15 ? "ต่ำกว่า" : "ไม่เอนไปทางใดชัดเจน";
  const kind = {rule:"วัดได้ด้วยกฎ", mixed:"กึ่งกฎกึ่งตีความ", judge:"ต้องตีความ"}[c.kind];

  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="crumb"><span class="link" data-a="go" data-x="summary">สรุปผล</span> ›</span>
      ${CRIT.map(x=>`<button class="btn" style="${x.id===c.id?'background:var(--ink);color:var(--bg);border-color:var(--ink)':''};font-size:11.5px;padding:5px 10px"
        data-a="crit" data-x="${x.id}">${x.id}</button>`).join("")}
    </div>
  </div>

  <div class="grid2">
   <div>
    <div class="card">
      <h2>${c.id} · ${esc(c.name)}</h2>
      <div class="sub">${kind} · n=${c.n}</div>
      <div class="headline">
        <div class="big"><div class="n">${c.qwk.toFixed(2)}</div><div class="l">QWK ของ AI</div>
          <div class="c">เพดานมนุษย์ของเกณฑ์นี้ <b>${c.ceil.toFixed(2)}</b> · ห่าง ${(c.ceil-c.qwk).toFixed(2)}</div></div>
        <div class="big"><div class="n" style="color:${Math.abs(c.bias)>.15?'var(--danger)':'var(--ink)'}">${c.bias>0?"+":""}${c.bias.toFixed(2)}</div>
          <div class="l">ระดับที่ AI ให้ ${dir} อาจารย์โดยเฉลี่ย</div>
          <div class="c">${Math.abs(c.bias)>.15
            ? "<b>เอนไปทางเดียว</b> — แก้ได้ด้วยการเขียนข้อความเกณฑ์ใหม่"
            : "กระจายสองทาง — แก้ข้อความไม่ช่วย ต้องดูที่หลักฐานที่ AI ใช้"}</div></div>
      </div>
      ${Math.abs(c.bias)>.15 ? `<div class="note ${c.bias>0?"d":"w"}">
        <b>ความเอนทางเดียวคือข่าวดี</b> เพราะแปลว่า AI เข้าใจ "อะไรคือดี" ตรงกับอาจารย์
        แต่ตั้ง<b>เส้นแบ่งระดับ</b>ไว้${c.bias>0?"หลวมเกินไป":"เข้มเกินไป"} — แก้ได้ด้วยการเขียนเงื่อนไขของแต่ละระดับให้ชัดขึ้น
        ต่างจากกรณีที่คลาดกระจายสองทาง ซึ่งแปลว่า AI ไม่เข้าใจตัวเกณฑ์เลย และการแก้ข้อความจะไม่ช่วย</div>` : ``}
    </div>

      <h2>ข้อความของเกณฑ์นี้ใน rubric v3.0</h2>
      <div class="diff"><div class="h">ระดับ 3 · ดี</div><div class="b">

      ส่วนอาจารย์ตีความเป็น "ทำงานนั้นจนจบได้จริงตาม user story ที่ให้ไว้" — สองอย่างนี้ไม่เหมือนกัน

    </div>
   </div>

   <div>
    <div class="card">
      <h2>เทียบกับเกณฑ์อื่น</h2>
      <table class="tbl">
        ${[...CRIT].sort((a,b)=>a.qwk-b.qwk).map(x=>`<tr style="${x.id===c.id?'background:var(--panel-2)':''}">

      <div class="note"><b>เกณฑ์ที่วัดได้ด้วยกฎ ทำได้ดีกว่าเกณฑ์ที่ต้องตีความทุกข้อ</b><br>
      C2 C3 C7 (กฎ) เฉลี่ย 0.74 · C5 C6 (ตีความ) เฉลี่ย 0.33<br><br>
      สอดคล้องกับที่ ticket 09 เขียนไว้ล่วงหน้า — <b>ผลนี้ยืนยันสมมติฐาน ไม่ใช่เรื่องเซอร์ไพรส์</b>

      <div class="note d">เมื่อเกณฑ์ใดถูกอาจารย์แก้เกิน <b>30% ของทั้งชั้น</b>

    </div>
   </div>
  </div>`;

  let segs="";
  for(let i=0;i<HIST.length-1;i++){
    segs += `<div class="tlseg" style="left:${x(i)};top:${y(HIST[i].q)}px;
      width:calc((100% - ${PADL+PADR}px)/${HIST.length-1});
      transform:rotate(${Math.atan2(y(HIST[i+1].q)-y(HIST[i].q), 600/(HIST.length-1))}rad)"></div>`;

  <div class="grid2">

      <div class="tl" style="height:${H+64}px">
        <div class="tlband" style="top:${y(CEIL.qwk+.05)}px;height:${y(CEIL.qwk-.05)-y(CEIL.qwk+.05)}px;
          left:${PADL}px;right:${PADR}px"></div>
        <div class="tlbandl" style="top:${y(CEIL.qwk)-8}px">เพดานมนุษย์ ${CEIL.qwk.toFixed(2)}</div>
        ${[.3,.5,.7,.9].map(q=>`
          <div class="tlaxis" style="top:${y(q)+26}px;left:${PADL}px;right:${PADR}px;opacity:.6"></div>

        ${segs.replace(/top:(\d[\d.]*)px/g,(m,p)=>`top:${(+p)+26}px`)}
        ${HIST.map((h,i)=>`<div class="tlpt ${i===S.hist?"sel":""}" data-a="hist" data-x="${i}"

        ${HIST.map((h,i)=>`<div class="tlx" style="left:${x(i)};top:${H+34}px">

    `<button class="${s[0]===S.v?"on":""}" data-a="go" data-x="${s[0]}">${s[1]}</button>`).join("");
  const sl = document.getElementById("samp");
  if(sl) sl.oninput = e => { S.sample = +e.target.value; render();
    const n=document.getElementById("samp"); if(n){n.focus();} };
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]");
  if(!el) return;
  const a = el.dataset.a, x = el.dataset.x;
  if(a==="go"){ S.v = x; scrollTo(0,0); }
  if(a==="crit"){ S.crit = x; S.v = "criterion"; scrollTo(0,0); }
  if(a==="hist"){ S.hist = +x; }
  if(a==="meth"){ S.method = x; }
  if(a==="set"){ S.set = x; }
  render();
});

document.addEventListener("keydown", e=>{
  const t = document.activeElement ? document.activeElement.tagName : "";
  if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA") return;
  const i = SCREENS.findIndex(s=>s[0]===S.v);
  if(e.key==="ArrowLeft"){ S.v = SCREENS[(i-1+SCREENS.length)%SCREENS.length][0]; scrollTo(0,0); render(); }
  if(e.key==="ArrowRight"){ S.v = SCREENS[(i+1)%SCREENS.length][0]; scrollTo(0,0); render(); }
});

const q = new URL(location).searchParams.get("v");
if(q && VIEWS[q]) S.v = q;
render();
</script>
