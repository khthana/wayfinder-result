<title>Prototype — หน้าจอตรวจงาน (ticket 21)</title>

<!--
  PROTOTYPE — โยนทิ้งได้ ไม่ใช่โค้ดจริง
  สามรูปแบบของหน้าจอตรวจงาน สลับด้วย ?variant=A|B|C หรือลูกศรที่แถบล่าง
  หกประเภทงาน สลับที่ topbar — เลือกมาให้ครอบคลุมทั้ง "หน่วยของหลักฐาน" 4 แบบ
  และ "รูปแบบ rubric" 3 แบบ ตามที่พบในเอกสารตรวจงานฉบับที่ใช้กับ TA จริง (ticket 25)
  ข้อมูลทั้งหมดสมมติ · ticket 21 ของ .scratch/ai-grading-agent
-->

<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --panel-2:#fbfbfa; --ink:#1c1c1a; --ink-2:#5a5a54;
  --ink-3:#8a8a82; --line:#e2e2dc; --line-2:#cfcfc7;
  --ai:#6d4aff; --ai-bg:#f0ecff; --ai-line:#d5cbff;
  --teacher:#0d7a4f; --teacher-bg:#e6f5ee; --teacher-line:#b9e2d0;
  --warn:#b06a00; --warn-bg:#fdf1de; --warn-line:#f0d5a8;
  --danger:#b3261e; --danger-bg:#fdecea; --danger-line:#f3c4bf;
  --blind:#1a1a2e; --blind-ink:#e8e6ff;
  --paper:#ffffff; --paper-ink:#22221f; --paper-line:#e4e4de; --paper-mute:#f2f2ee;
  --r:10px; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131312; --panel:#1c1c1b; --panel-2:#232322; --ink:#eceae5; --ink-2:#a9a79f;
  --ink-3:#78766f; --line:#302f2d; --line-2:#413f3c;
  --ai:#a892ff; --ai-bg:#241f3d; --ai-line:#3d3363;
  --teacher:#5bcf9b; --teacher-bg:#0f2a20; --teacher-line:#1d4b38;
  --warn:#e6a94d; --warn-bg:#332711; --warn-line:#5c4519;
  --danger:#ef7c72; --danger-bg:#361a17; --danger-line:#5c2b25;
  --blind:#0c0c16; --blind-ink:#d8d5ff;
  --paper:#f4f3ef; --paper-ink:#22221f; --paper-line:#dcdbd4; --paper-mute:#e9e8e2;
}}
:root[data-theme="dark"]{
  --bg:#131312; --panel:#1c1c1b; --panel-2:#232322; --ink:#eceae5; --ink-2:#a9a79f;
  --ink-3:#78766f; --line:#302f2d; --line-2:#413f3c;
  --ai:#a892ff; --ai-bg:#241f3d; --ai-line:#3d3363;
  --teacher:#5bcf9b; --teacher-bg:#0f2a20; --teacher-line:#1d4b38;
  --warn:#e6a94d; --warn-bg:#332711; --warn-line:#5c4519;
  --danger:#ef7c72; --danger-bg:#361a17; --danger-line:#5c2b25;
  --blind:#0c0c16; --blind-ink:#d8d5ff;
  --paper:#f4f3ef; --paper-ink:#22221f; --paper-line:#dcdbd4; --paper-mute:#e9e8e2;
}
:root[data-theme="light"]{
  --bg:#f6f6f4; --panel:#ffffff; --panel-2:#fbfbfa; --ink:#1c1c1a; --ink-2:#5a5a54;
  --ink-3:#8a8a82; --line:#e2e2dc; --line-2:#cfcfc7;
  --ai:#6d4aff; --ai-bg:#f0ecff; --ai-line:#d5cbff;
  --teacher:#0d7a4f; --teacher-bg:#e6f5ee; --teacher-line:#b9e2d0;
  --warn:#b06a00; --warn-bg:#fdf1de; --warn-line:#f0d5a8;
  --danger:#b3261e; --danger-bg:#fdecea; --danger-line:#f3c4bf;
  --blind:#1a1a2e; --blind-ink:#e8e6ff;
  --paper:#ffffff; --paper-ink:#22221f; --paper-line:#e4e4de; --paper-mute:#f2f2ee;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Leelawadee UI","Noto Sans Thai","IBM Plex Sans Thai","Sarabun",
    -apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}

/* ---------- switcher ---------- */
.protobar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;
  display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;
  padding:5px;box-shadow:0 6px 28px rgba(0,0,0,.4);border:1px solid #333}
.protobar button{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:#fff;font-size:15px}
.protobar button:hover{background:#333}
.protobar .lbl{padding:0 14px;font-size:12.5px;white-space:nowrap;font-weight:600}
.protobar .lbl small{opacity:.55;font-weight:400;margin-left:7px}
.protonote{position:fixed;left:12px;bottom:16px;z-index:9999;font-size:11px;color:var(--ink-3);
  background:var(--panel);border:1px solid var(--line);padding:4px 9px;border-radius:999px}

/* ---------- chrome ---------- */
.topbar{min-height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;flex-wrap:wrap;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.crumb{font-size:12.5px;color:var(--ink-2)}
.crumb b{color:var(--ink);font-weight:650}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.ai{background:var(--ai-bg);color:var(--ai);border-color:var(--ai-line)}
.pill.teacher{background:var(--teacher-bg);color:var(--teacher);border-color:var(--teacher-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.pill.mute{background:var(--panel-2);color:var(--ink-3);border-color:var(--line)}
.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);
  font-size:12.5px;font-weight:600}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.87}
.btn.sm{padding:3px 9px;font-size:11.5px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--ink-2);background:var(--panel-2)}
.prog{height:5px;border-radius:999px;background:var(--line);overflow:hidden;min-width:100px}
.prog i{display:block;height:100%;background:var(--teacher)}
.dim{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.02em}

/* ---------- ชิ้นงาน: กระดาษ/ผืนผ้าใบ ---------- */
.canvas{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;overflow:auto}
.canvashead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);
  border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* figma */
.frames{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.frame{width:186px;flex:0 0 auto;position:relative}
.frame .cap{font-size:10.5px;color:var(--ink-3);margin-bottom:6px;font-family:var(--mono)}
.screen{position:relative;width:186px;height:372px;background:var(--paper);
  border:1px solid var(--paper-line);border-radius:14px;overflow:hidden}
.screen .st{height:20px;background:var(--paper-mute)}
.screen .hd{height:34px;background:#5b6cff;display:flex;align-items:center;padding:0 11px;color:#fff;font-size:9px}
.screen .bd{padding:11px;display:flex;flex-direction:column;gap:7px}
.bar{background:#e0e0e6;border-radius:3px;height:9px}
.bar.t{height:13px;width:62%;background:#c6c6d1}
.bar.s{height:7px;width:80%}
.inp{height:27px;border:1px solid #d6d6de;border-radius:6px;background:#fafaff}
.inp.bad{border-color:#f0b4ae;background:#fff6f5}
.cta{height:31px;border-radius:6px;background:#5b6cff}
.cta.pale{background:#b9c0ff}
.mcard{border:1px solid #e4e4ea;border-radius:7px;padding:8px;display:flex;flex-direction:column;gap:5px}
.row2{display:flex;gap:6px}.row2>*{flex:1}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:32px;border-top:1px solid #e4e4ea;display:flex;background:var(--paper)}
.tabbar i{flex:1;border-right:1px solid #f0f0f4}
.pin{position:absolute;width:19px;height:19px;border-radius:999px;background:var(--ai);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px rgba(109,74,255,.22);cursor:pointer;transition:transform .12s}
.pin.on{background:var(--warn);box-shadow:0 0 0 5px rgba(176,106,0,.3);transform:translate(-50%,-50%) scale(1.3)}
.pinbox{position:absolute;border:2px solid var(--warn);border-radius:5px;pointer-events:none;
  background:rgba(176,106,0,.12);opacity:0;transition:opacity .15s}
.pinbox.on{opacity:1}

/* persona (PDF 1 หน้า) */
.pdfpage{width:470px;margin:0 auto;padding:20px;position:relative}
.pdfmeta{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:center;margin-bottom:8px}
.fld{position:relative;border-radius:6px;padding:2px;transition:box-shadow .15s,background .15s}
.fld.on{background:rgba(176,106,0,.14);box-shadow:0 0 0 2px var(--warn)}
.fld .fnum{position:absolute;left:-11px;top:-9px;width:18px;height:18px;border-radius:999px;
  background:var(--warn);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center}
.fld.on .fnum{display:grid}
.phead{display:flex;gap:13px;align-items:flex-start;margin-bottom:12px}
.photo{width:74px;height:74px;border-radius:8px;background:var(--paper-mute);flex:0 0 auto;
  display:grid;place-items:center;font-size:26px;color:#b9b9b1}
.pquote{border-left:3px solid #5b6cff;padding:6px 10px;background:var(--paper-mute);
  border-radius:0 6px 6px 0;font-style:italic;font-size:12.5px;margin-bottom:12px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pbox{border:1px solid var(--paper-line);border-radius:7px;padding:9px}
.pbox h5{margin:0 0 5px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#8d8d84}
.pbox ul{margin:0;padding-left:16px;font-size:12px}
.pbox li{margin-bottom:3px}
.pbar{height:6px;background:var(--paper-mute);border-radius:9px;margin:4px 0 8px;overflow:hidden}
.pbar i{display:block;height:100%;background:#5b6cff}

/* heuristic evaluation (ตารางรายการ finding) */
.htable{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.htable th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:#8d8d84;padding:6px 9px;border-bottom:1px solid var(--paper-line);font-weight:650}
.htable td{padding:8px 9px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.htable tr.on td{background:rgba(176,106,0,.13);box-shadow:inset 3px 0 0 var(--warn)}
.hchip{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:650;
  background:var(--paper-mute);color:#4a4a44;white-space:nowrap}
.hchip.bad{background:#fbe3e0;color:#a4322a}
.hchip.ok{background:#e2f2e9;color:#166b47}
.arrow{color:#a4322a;font-weight:700;margin:0 4px}
.sev{display:inline-block;width:44px;text-align:center;padding:1px 0;border-radius:5px;
  font-size:11px;font-weight:700}
.sev.s3{background:#fbe3e0;color:#a4322a}.sev.s2{background:#fdeed6;color:#8a5500}.sev.s1{background:#eceae4;color:#6c6c64}
.cover{display:flex;gap:4px;flex-wrap:wrap;margin-top:11px}
.cover b{font-size:11px;color:var(--ink-3);font-family:var(--mono);width:100%;margin-bottom:2px}
.hn{width:29px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;
  font-weight:700;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-3)}
.hn.has{background:var(--teacher-bg);border-color:var(--teacher-line);color:var(--teacher)}
.hn.gap{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}

/* empathy map */
.emap{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--paper-line);
  border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;max-width:560px;margin:0 auto}
.equad{background:var(--paper);padding:11px;min-height:132px;position:relative;transition:box-shadow .15s}
.equad.on{box-shadow:inset 0 0 0 3px var(--warn)}
.equad h5{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8d8d84;margin-bottom:7px}
.notes{display:flex;flex-wrap:wrap;gap:5px}
.stick{background:#fff3b0;color:#3d3418;padding:5px 7px;border-radius:3px;font-size:11.5px;
  max-width:150px;box-shadow:0 1px 2px rgba(0,0,0,.12);transform:rotate(-.6deg)}
.stick:nth-child(even){transform:rotate(.8deg);background:#ffe9a8}
.stick.on{outline:2px solid var(--warn);background:#ffd166}
.stick.miss{background:#ffd9d4;color:#7d2b23}

/* ---------- เกณฑ์ / คะแนน ---------- */
.crit{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:9px;overflow:hidden}
.crit.focus{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-bg)}
.crit.edited{border-left:3px solid var(--teacher)}
.crit .ch{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
.crit .ch h4{font-size:13px;flex:1}
.crit .cb{padding:0 12px 12px;border-top:1px dashed var(--line)}
.levels{display:flex;gap:5px;margin:9px 0}
.lv{flex:1;padding:7px 3px;border:1px solid var(--line-2);border-radius:8px;text-align:center;
  font-size:11.5px;font-weight:600;background:var(--panel);position:relative}
.lv:hover{background:var(--panel-2)}
.lv b{display:block;font-size:16px;line-height:1.15}
.lv.aipick{border-color:var(--ai-line);background:var(--ai-bg);color:var(--ai)}
.lv.mine{border-color:var(--teacher);background:var(--teacher-bg);color:var(--teacher);box-shadow:0 0 0 2px var(--teacher-line)}
.lv .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;
  padding:1px 5px;border-radius:999px;background:var(--ai);color:#fff;white-space:nowrap}
.lv.mine .tag{background:var(--teacher)}
.why{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:8px;padding:9px 10px;font-size:12.5px}
.why .lead{font-size:10.5px;color:var(--ai);font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.ev{display:inline-flex;align-items:center;gap:5px;margin:5px 5px 0 0;padding:3px 8px;
  border:1px solid var(--ai-line);border-radius:999px;font-size:11.5px;background:var(--panel);color:var(--ai)}
.ev:hover{background:var(--ai-bg)}
.ev.on{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.conf{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.conf .dots{display:flex;gap:3px}
.conf .dots i{width:7px;height:7px;border-radius:2px;background:var(--line-2)}
.conf .dots i.on{background:var(--ai)}
.conf .dots i.split{background:var(--warn)}
.note{width:100%;margin-top:8px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--panel-2);font:inherit;font-size:12.5px;color:var(--ink);resize:vertical;min-height:34px}
.nudge{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:var(--r);
  padding:11px 12px;margin-bottom:10px;font-size:12.5px}
.nudge b{color:var(--warn)}
.nudge .acts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}

/* ---------- VARIANT A ---------- */
#vA .wrap{display:grid;grid-template-columns:186px 1fr 380px;height:calc(100vh - 92px)}
#vA .list{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#vA .lh{padding:9px 12px;font-size:11px;color:var(--ink-3);position:sticky;top:0;
  background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--mono)}
#vA .li{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
  align-items:center;gap:7px;font-size:12.5px;width:100%;text-align:left}
#vA .li:hover{background:var(--panel-2)}
#vA .li.on{background:var(--ai-bg);box-shadow:inset 3px 0 0 var(--ai)}
#vA .li .dot{width:7px;height:7px;border-radius:999px;flex:0 0 auto;background:var(--line-2)}
#vA .li .dot.done{background:var(--teacher)}
#vA .li .dot.q{background:var(--warn)}
#vA .li .dot.fail{background:var(--danger)}
#vA .mid{overflow-y:auto;padding:14px}
#vA .side{border-left:1px solid var(--line);background:var(--panel-2);overflow-y:auto;padding:12px}
#vA .sidefoot{position:sticky;bottom:-12px;margin:10px -12px -12px;padding:11px 12px;
  background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

/* ---------- VARIANT B ---------- */
#vB .stage{max-width:1120px;margin:0 auto;padding:16px 16px 96px}
#vB .critbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#vB .deck{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:1000px){#vB .deck{grid-template-columns:1fr}}
#vB .cardq{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
#vB .stack{position:relative}
#vB .stack:before,#vB .stack:after{content:"";position:absolute;left:9px;right:9px;height:14px;
  border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:var(--panel-2)}
#vB .stack:before{top:-7px}
#vB .stack:after{top:-13px;left:18px;right:18px;opacity:.6}
#vB .keys{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:9px 16px 22px;display:flex;gap:15px;align-items:center;font-size:12px;color:var(--ink-2);
  z-index:40;flex-wrap:wrap}
#vB .queue{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#vB .qi{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:12px}
#vB .qi.on{background:var(--ai-bg)}
#vB .qi.done{color:var(--ink-3)}
#vB .qi .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:26px}

/* ---------- VARIANT C ---------- */
#vC .page{padding:14px;max-width:1400px;margin:0 auto}
#vC table.mx{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:12.5px}
#vC .mx th,#vC .mx td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
#vC .mx th{background:var(--panel-2);font-weight:650;font-size:11px;color:var(--ink-2);
  padding:8px 6px;text-align:center;vertical-align:bottom;line-height:1.25}
#vC .mx th.name,#vC .mx td.name{text-align:left;padding-left:11px;width:180px;white-space:nowrap}
#vC .mx td.name{padding-top:7px;padding-bottom:7px}
#vC .sc{width:100%;height:34px;display:flex;align-items:center;justify-content:center;
  font-weight:650;font-size:13px;position:relative}
#vC .sc:hover{outline:2px solid var(--ai);outline-offset:-2px;z-index:2}
#vC .h1{background:color-mix(in srgb,var(--danger-bg) 92%,transparent);color:var(--danger)}
#vC .h2{background:color-mix(in srgb,var(--warn-bg) 80%,transparent);color:var(--warn)}
#vC .h3{background:var(--panel);color:var(--ink-2)}
#vC .h4{background:color-mix(in srgb,var(--teacher-bg) 75%,transparent);color:var(--teacher)}
#vC .flag{position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:999px}
#vC .flag.q{background:var(--warn)}#vC .flag.b{background:var(--ai)}#vC .flag.e{background:var(--teacher)}

  {id:"G12",n:"กลุ่ม 12",m:3,st:"ai",flags:["outlier"],r:.6,late:0},
  {id:"G13",n:"กลุ่ม 13",m:3,st:"ai",flags:["blind"],r:.85,late:0},
  {id:"G14",n:"กลุ่ม 14",m:3,st:"pending",flags:[],r:0,late:0},
];
const FLAGTXT = {blind:"อยู่ในชุด blind", boundary:"คะแนนใกล้เส้นเกรด ±5%", failed:"AI ตรวจไม่สำเร็จ",
  "extreme-low":"คะแนนต่ำสุด 3 อันดับ", "extreme-high":"คะแนนสูงสุด 3 อันดับ",
  outlier:"ต่างจากประวัติกลุ่มนี้เกิน 2 SD", late:"ส่งช้า", "too-late":"ส่งช้าเกิน 3 วัน"};

const S = {variant:"A", work:"figma", group:"G01", blind:false, focusCrit:null,
  activeEv:null, mine:{}, bIndex:0, bCrit:null, drawer:null, fb:{}, chk:{}, cnt:{}};

const W = ()=>WORKS[S.work];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   ตัวเรนเดอร์ชิ้นงาน — dispatch ตามประเภท
   นี่คือแก่นของ ticket: หลักฐานของแต่ละประเภทเป็นคนละหน่วยกัน
   ============================================================ */
function evsOf(cid){
  const a = W().ai[cid];
  if(!a) return [];
  if(a.items) return a.items.map(x=>x.ev);
  return a.ev || [];
}
function anyActiveEv(){
  if(!S.activeEv) return null;
  const [c,i] = S.activeEv.split("|");
  return evsOf(c)[+i] || null;
}

function renderWork(){
  const w = W(), a = anyActiveEv();
  const head = `<div class="canvashead">
    <span class="pill mute">${esc(w.file)}</span>
    <span class="dim">หน่วยของหลักฐาน: ${esc(w.anchor)}</span>
    <div class="spacer"></div>
    <span class="dim">ไฟล์ถูกแช่แข็งตอนกดส่ง</span>
    <button class="btn sm">เปิดไฟล์ต้นฉบับ</button>
  </div>`;
  return `<div class="canvas">${head}${
    w.kind==="figma"     ? wFigma(a) :
    w.kind==="persona"   ? wPersona(a) :
    w.kind==="heuristic" ? wHeuristic(a) :
    w.kind==="journey"   ? wJourney(a) : wEmpathy(a)}</div>`;
}

/* --- Journey: ไฮไลต์ช่องที่ตัดกันระหว่างแถว (lane) กับขั้นตอน (stage) --- */
function wJourney(a){
  return `<div class="jwrap"><div class="jgrid">
    <div class="jc hd"></div>${JSTAGES.map(s=>`<div class="jc hd">${esc(s)}</div>`).join("")}
    ${JLANES.map(L=>`<div class="jc lane">${esc(L.t)}</div>`+
      L.c.map((v,i)=>`<div class="jc ${v?"":"empty"} ${a&&a.lane===L.k&&a.st===i?"on":""} ${L.emo?"emo":""}">${esc(v)}</div>`).join("")
    ).join("")}
  </div></div>
  <div class="dim" style="margin-top:9px">หลักฐานชี้ที่ "แถว × ขั้นตอน" — ไม่ต้องใช้พิกัด ขอแค่ AI อ่านโครงตารางของบอร์ดออก</div>`;
}

/* --- Figma: หมุดพิกัด — เคสหลักของระบบ และเคสที่ชั้นอ่านไฟล์ยากที่สุด --- */
function wFigma(a){
  /* เกณฑ์ human_only ไม่มีหลักฐานจาก AI เลย — ต้องคืนอาร์เรย์ว่าง ไม่ใช่ undefined */
  const evs = (S.focusCrit && W().ai[S.focusCrit] ? W().ai[S.focusCrit].ev : []) || [];
  const pins = fi => evs.map((e,i)=> e.f===fi ? `
    <div class="pinbox ${a===e?"on":""}" style="left:${e.x-e.w/2}%;top:${e.y-e.h/2}%;width:${e.w}%;height:${e.h}%"></div>
    <div class="pin ${a===e?"on":""}" data-ev="${S.focusCrit}|${i}" style="left:${e.x}%;top:${e.y}%" title="${esc(e.l)}">${i+1}</div>`:"").join("");
  return `<div class="frames">
    <div class="frame"><div class="cap">01_signup.png</div><div class="screen">
      <div class="st"></div><div class="hd">สมัครสมาชิก · ขั้นที่ 2</div>
      <div class="bd"><div class="bar t"></div><div class="bar s"></div><div class="inp"></div><div class="inp"></div>
        <div class="inp bad"></div><div class="bar s" style="width:55%"></div><div class="cta"></div>
        <div class="bar s" style="width:45%;margin:0 auto"></div></div>${pins(1)}</div></div>
    <div class="frame"><div class="cap">02_home.png</div><div class="screen">
      <div class="st"></div><div class="hd">หน้าแรก</div>
      <div class="bd"><div class="bar t" style="width:48%"></div>
        <div class="row2"><div class="cta pale" style="height:24px"></div><div class="cta pale" style="height:24px"></div></div>
        <div class="mcard"><div class="bar" style="height:34px"></div><div class="bar s"></div><div class="bar s" style="width:52%"></div></div>
        <div class="mcard"><div class="bar" style="height:34px"></div><div class="bar s"></div><div class="bar s" style="width:52%"></div></div></div>
      <div class="tabbar"><i></i><i></i><i></i><i></i></div>${pins(2)}</div></div>
  </div>
  <div class="dim" style="text-align:center;margin-top:9px">หมุดแสดงเฉพาะหลักฐานของเกณฑ์ที่กำลังเปิด${S.focusCrit?" ("+S.focusCrit+")":" — ยังไม่ได้เปิดเกณฑ์ใด"}</div>`;
}

/* --- Persona: ไฮไลต์ช่องในเทมเพลตบนหน้า PDF --- */

  const on = f => a && a.fld===f ? "on" : "";
  return `<div class="pdfmeta">persona_wichai.pdf · หน้า 1 จาก 3</div>
  <div class="paper pdfpage">
    <div class="phead">
      <div class="photo">◔</div>
      <div style="flex:1">
        <div class="fld ${on("basic")}"><span class="fnum">!</span>
          <h3 style="font-size:19px">วิชัย · 34 ปี</h3>
          <div style="color:#77776e;font-size:12px">พนักงานขนส่ง · กรุงเทพฯ · ใช้ Android</div>
        </div>
        <div class="fld ${on("skill")}" style="margin-top:8px"><span class="fnum">!</span>
          <div style="font-size:11px;color:#8d8d84;letter-spacing:.05em">ความถนัดเทคโนโลยี</div>

    </div>
    <div class="fld ${on("quote")}"><span class="fnum">!</span>
      <div class="pquote">"ผมแค่อยากรู้ว่าจองติดหรือยัง ไม่ต้องสวยก็ได้"</div></div>
    <div class="pcols">
      <div class="fld ${on("goals")}"><span class="fnum">!</span><div class="pbox">
        <h5>เป้าหมาย</h5><ul>
        <li>อยากใช้แอปที่ใช้ง่าย</li>
        <li>จองคิวให้ทันก่อนออกจากบ้าน 7 โมงเช้า</li></ul></div></div>
      <div class="fld ${on("pains")}"><span class="fnum">!</span><div class="pbox">
        <h5>ความคับข้องใจ</h5><ul>
        <li>ต้องกรอกข้อมูลเดิมซ้ำทุกครั้ง <span style="color:#a4322a">(R2)</span></li>
        <li>ไม่รู้ว่ากดยืนยันไปแล้วสำเร็จหรือไม่</li></ul></div></div>
      <div class="fld ${on("behav")}" style="grid-column:1/-1"><span class="fnum">!</span><div class="pbox">
        <h5>พฤติกรรม</h5><ul>
        <li>ใช้แอปธนาคารและแอปสั่งอาหารเป็นประจำทุกวัน</li>
        <li>เช็กหน้าจอยืนยันซ้ำหลายครั้ง <span style="color:#a4322a">(R5)</span></li></ul></div></div>
    </div>
  </div>
  <div class="dim" style="text-align:center;margin-top:9px">หลักฐานชี้ที่ "ช่องในเทมเพลต" ไม่ใช่พิกัด — ทำงานได้แม้นักศึกษาจัดหน้าไม่เหมือนกัน</div>`;
}

/* --- Heuristic: ไฮไลต์แถว + แสดงข้อที่ AI ว่าควรเป็น --- */
function wHeuristic(a){
  const covered = new Set(FINDINGS.map(f=>f.stu));
  return `<div class="paper" style="padding:4px 6px 10px">
    <table class="htable"><thead><tr>
      <th style="width:26px">#</th><th>ปัญหาที่พบ</th><th style="width:210px">Heuristic ที่ระบุ</th>
      <th style="width:58px">ระดับ</th><th style="width:180px">ข้อเสนอแนะ</th>
    </tr></thead><tbody>
    ${FINDINGS.map(f=>{
      const wrong = f.stu!==f.ai;
      return `<tr class="${a&&a.row===f.n?"on":""}">
        <td style="font-family:var(--mono);color:#8d8d84">${f.n}</td>
        <td>${esc(f.prob)}</td>
        <td><span class="hchip ${wrong?"bad":"ok"}">${f.stu}. ${esc(NIELSEN[f.stu])}</span>
          ${wrong&&!S.blind?`<div style="margin-top:3px;font-size:11px"><span class="arrow">↳ AI ว่าเป็น</span>
            <span class="hchip">${f.ai}. ${esc(NIELSEN[f.ai])}</span></div>`:""}</td>
        <td><span class="sev s${f.sev}">${["น้อย","ปานกลาง","สูง"][f.sev-1]}</span></td>
        <td style="color:#66665e">${esc(f.fix)}</td></tr>`;
    }).join("")}
    </tbody></table></div>
  <div class="cover"><b>ความครอบคลุมทั้ง 10 ข้อของ Nielsen — ช่องแดงคือข้อที่ไม่ได้รายงานเลย</b>
    ${Object.keys(NIELSEN).map(k=>`<span class="hn ${covered.has(+k)?"has":"gap"}" title="${esc(NIELSEN[k])}">${k}</span>`).join("")}
  </div>
  <div class="dim" style="margin-top:9px">หลักฐานชี้ที่ "เลขรายการ" — เป็นประเภทงานที่ AI ชี้หลักฐานได้แม่นที่สุด เพราะทั้งชิ้นเป็นโครงสร้างอยู่แล้ว</div>`;
}

/* --- Empathy: ไฮไลต์ช่อง + โน้ต --- */
function wEmpathy(a){
  return `<div class="emap">${QUADS.map(q=>`
    <div class="equad ${a&&a.q===q.k?"on":""}">
      <h5>${esc(q.t)}</h5>
      <div class="notes">${q.notes.map((nt,i)=>`
        <div class="stick ${a&&a.q===q.k&&a.note===i?"on":""} ${nt.miss?"miss":""}">${esc(nt.t)}</div>`).join("")}</div>
    </div>`).join("")}</div>
  <div class="dim" style="text-align:center;margin-top:9px">หลักฐานชี้ที่ "ช่อง + ลำดับโน้ต" — โน้ตสีชมพูคือที่ AI ว่าอยู่ผิดช่อง</div>`;
}

/* ============================================================ */
function confHtml(samples){
  const agree = new Set(samples).size===1;
  return `<span class="conf" title="รันซ้ำ 3 ครั้งที่ temperature 0.4 — ได้ระดับ ${samples.join(", ")}">
    <span class="dots">${samples.map(()=>`<i class="${agree?"on":"split"}"></i>`).join("")}</span>
    ${agree?"รันซ้ำ 3 ครั้งได้ผลตรงกัน":`รันซ้ำ 3 ครั้งได้ ${samples.join("/")} — <b>ไม่นิ่ง</b>`}</span>`;
}

function evChips(cid){
  return evsOf(cid).map((e,i)=>
    `<button class="ev${S.activeEv===cid+"|"+i?" on":""}" data-ev="${cid}|${i}">◎ ${esc(e.l)}</button>`).join("");
}

/* ---- เกณฑ์สองแบบที่ "คำนวณ" ไม่ใช่ "ตัดสิน" — LLM ไม่ได้แตะเลขพวกนี้เลย ---- */
const okOf  = (cid,i)=> S.chk[cid+"|"+i]!==undefined ? S.chk[cid+"|"+i] : W().ai[cid].items[i].ok;
const cntOf = cid => S.cnt[cid]!==undefined ? S.cnt[cid] : W().ai[cid].counted;
function calcScore(cid){
  const a = W().ai[cid];
  if(a.items){ const miss = a.items.filter((_,i)=>!okOf(cid,i)).length;
    return Math.max(0, a.full - miss*a.ded); }
  if(a.formula) return cntOf(cid) >= a.min ? a.full : Math.max(0, a.full - a.ded);
  return null;
}

function levelRow(cid, aiLv){
  const mine = S.mine[cid];
  return `<div class="levels">`+(W().levels||LEVELS).map(L=>{
    const isAi=!S.blind&&L.n===aiLv, isMine=mine===L.n;
    return `<button class="lv${isAi?" aipick":""}${isMine?" mine":""}" data-lv="${L.n}" data-crit="${cid}">
      ${isMine?'<span class="tag">คะแนนของคุณ</span>':isAi?'<span class="tag">AI เสนอ</span>':""}
      <b>${L.n}</b>${L.t}</button>`;
  }).join("")+`</div>`;
}

function critBlock(c, forceOpen){
  const a = W().ai[c.id], mine = S.mine[c.id];
  const open = forceOpen || S.focusCrit===c.id;
  const kind = c.k || "level";

  /* --- ป้ายคะแนนบนหัวเกณฑ์ ต่างกันตามรูปแบบของ rubric --- */
  let pill, changed = false, edited = mine!==undefined;
  if(kind==="human"){
    pill = mine!==undefined ? `<span class="pill teacher">คุณให้ ${mine}/${a.full}</span>`
                            : `<span class="pill mute">ระบบไม่ให้คะแนนข้อนี้</span>`;
  }else if(kind==="check"||kind==="count"){
    const sc = calcScore(c.id);
    const touched = Object.keys(S.chk).some(k=>k.startsWith(c.id+"|")) || S.cnt[c.id]!==undefined;
    edited = touched;
    pill = `<span class="pill ${touched?"teacher":"ai"}">${touched?"หลังคุณแก้ ":"ระบบคำนวณ "}${sc}/${a.full}</span>`;
  }else{
    changed = mine!==undefined && mine!==a.lv;
    pill = S.blind&&mine===undefined ? '<span class="pill mute">ซ่อนคะแนน AI</span>'
      : `<span class="pill ${mine!==undefined?"teacher":"ai"}">${mine!==undefined?"คุณให้ "+mine:"AI ให้ "+a.lv}</span>`;
  }

  /* --- เนื้อในของเกณฑ์ --- */
  let body;
  if(kind==="human"){
    body = `<div class="humanonly">
      <b style="color:var(--ink)">เกณฑ์นี้ล็อกไว้ให้คนตัดสินเท่านั้น</b><br>
      AI ไม่ให้คะแนนและไม่เสนอความเห็น เพราะเกณฑ์นี้ไม่มีคำบรรยายระดับที่วัดได้
      จึงวัดความเห็นตรงกันไม่ได้ และไม่ควรนับรวมในการประเมินความแม่นของระบบ
      <div class="levels" style="margin-top:9px">
        ${[0,1].map(n=>`<button class="lv${mine===n?" mine":""}" data-lv="${n}" data-crit="${c.id}">
          ${mine===n?'<span class="tag">คะแนนของคุณ</span>':""}<b>${n}</b>${n?"ให้":"ไม่ให้"}</button>`).join("")}
      </div></div>`;
  }else if(kind==="check"){
    const miss = a.items.filter((_,i)=>!okOf(c.id,i)).length;
    body = `<div class="chk">${a.items.map((it,i)=>{
      const ok = okOf(c.id,i);
      return `<button class="chkrow ${ok?"yes":"no"}" data-chk="${c.id}|${i}">
        <span class="mark">${ok?"✓":"✕"}</span><span>${esc(it.t)}</span>
        ${ok?"":`<span class="ded">−${a.ded}</span>`}</button>`;}).join("")}</div>
      <div class="calc"><span class="nollm">✓ ไม่ผ่าน LLM</span><br>
        คะแนนเต็ม <b>${a.full}</b> <span class="op">−</span> ขาด <b>${miss}</b> จุด <span class="op">×</span> จุดละ <b>${a.ded}</b>
        <span class="op">=</span> <span class="res">${calcScore(c.id)}</span></div>
      <div class="dim" style="margin-top:6px">แก้ที่รายการ ไม่ใช่แก้ที่ตัวเลข — กดสลับ ✓/✕ แล้วคะแนนขยับเอง</div>`;
  }else if(kind==="count"){
    const n = cntOf(c.id), pass = n>=a.min;
    body = `<div class="calc"><span class="nollm">✓ ไม่ผ่าน LLM</span><br>
        AI นับได้ <b>${n}</b> ใบ
        <button class="btn sm" data-cnt="${c.id}|-1" style="padding:0 7px">−</button>
        <button class="btn sm" data-cnt="${c.id}|1" style="padding:0 7px">+</button>
        ${S.cnt[c.id]!==undefined?`<span style="color:var(--teacher)">(คุณปรับจาก ${a.counted})</span>`:""}<br>
        สมาชิก <b>${W().members}</b> คน <span class="op">→</span> สูตรขั้นต่ำ <b>${esc(a.formula)}</b>
        <span class="op">=</span> <b>${a.min}</b><br>
        ${n} ${pass?"≥":"<"} ${a.min} <span class="op">→</span>
        <span class="res" style="${pass?"":"color:var(--danger)"}">${pass?"ครบ ได้เต็ม "+a.full:"ไม่ถึง หัก "+a.ded+" เหลือ "+calcScore(c.id)}</span></div>
      <div class="dim" style="margin-top:6px">
        LLM คืนมาแค่ "รายการที่นับได้พร้อมตำแหน่ง" — ความยาวของรายการและการเทียบสูตรเป็นงานของระบบ</div>`;
  }else{
    body = `${levelRow(c.id,a.lv)}`;
  }

  const showWhy = kind!=="human" && !(S.blind && mine===undefined);
  return `<div class="crit${open?" focus":""}${edited?" edited":""}">
    <button class="ch" data-toggle="${c.id}">
      <span class="dim" style="min-width:22px">${c.id}</span>
      <div style="flex:1"><h4>${esc(c.t)}</h4><div class="dim" style="margin-top:2px">${esc(c.dim)}</div></div>
      ${pill}
      ${changed?`<span class="pill warn">แก้จาก ${a.lv}</span>`:""}
    </button>
    ${open?`<div class="cb">
      <div style="padding:9px 0 2px;font-size:12px;color:var(--ink-2)">${esc(c.d)}</div>
      ${body}
      ${S.blind&&mine===undefined&&kind==="level"?`<div class="blindveil">โหมด blind — คะแนนและเหตุผลของ AI ถูกซ่อนไว้<br>
        <span style="opacity:.7">ให้คะแนนของคุณก่อน แล้วระบบจะเปิดให้เทียบ · เวลาที่เปิดจะถูกบันทึก</span></div>`
      :showWhy?`<div class="why"><div class="lead">${kind==="level"?"เหตุผลของ AI":"สิ่งที่ AI สังเกตเห็น (ไม่ใช่คะแนน)"}</div>
        ${esc(a.why).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
        ${a.rule?`<div style="margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--ai)">ชั้นคำนวณ · ${esc(a.rule)}</div>`:""}
        <div style="margin-top:6px">${evChips(c.id)}</div>
      </div>
      ${a.samples&&a.samples.length?`<div style="margin-top:8px">${confHtml(a.samples)}</div>`:""}`:""}
      ${changed?`<textarea class="note" placeholder="เหตุผลที่แก้ (บังคับ) — ข้อความนี้กลายเป็นข้อมูลสอน AI รอบถัดไป"></textarea>`:""}
    </div>`:""}
  </div>`;
}

/* ============================================================
   ชั้นคะแนนสุดท้าย — rubric แล้วค่อยหักส่งช้า ไม่ใช่เกณฑ์ใน rubric
   กติกาจากเอกสาร TA: หักวันละ 10% ของคะแนนเต็ม · หักแล้วเหลือ ≤ 0 ให้ 1 คะแนน
   ไม่ส่ง = 0 · ช้าเกิน 3 วัน = 0 และไม่ต้องตรวจ
   ============================================================ */
function ledgerHtml(g){
  const w = W(), full = w.full;
  if(g.st==="pending") return `<div class="ledger"><div class="lr"><span>ไม่ได้ส่งงาน</span>
    <span class="v" style="color:var(--danger)">0</span></div>
    <div class="dim" style="margin-top:4px">ไม่ส่ง = 0 · ต่างจากส่งช้าจนเหลือ 1 คะแนน</div></div>`;
  if(g.late>3) return `<div class="ledger" style="border-color:var(--danger-line)">
    <div class="lr"><span>ส่งช้า ${g.late} วัน — เกิน 3 วัน</span><span class="v" style="color:var(--danger)">0</span></div>
    <div class="dim" style="margin-top:4px">ระบบไม่เรียก AI ตรวจงานชิ้นนี้เลย — ประหยัดค่าเรียกโมเดล และตรงกับที่เอกสารสั่ง TA ว่า "ไม่ต้องตรวจ"</div></div>`;
  const raw = Math.round(full*g.r*2)/2;
  const pen = Math.round(full*0.1*g.late*10)/10;
  let fin = Math.round((raw-pen)*10)/10, floor = false;
  if(g.late>0 && fin<=0){ fin = 1; floor = true; }
  return `<div class="ledger">
    <div class="lr"><span>คะแนนจาก rubric</span><span class="v">${raw} / ${full}</span></div>
    ${g.late?`<div class="lr neg"><span>ส่งช้า ${g.late} วัน <span class="dim">(10% ของคะแนนเต็ม × ${g.late})</span></span>
      <span class="v">−${pen}</span></div>`:`<div class="lr"><span class="dim">ส่งตรงเวลา</span><span class="v dim">−0</span></div>`}
    <div class="sep"></div>
    <div class="lr tot"><span><b>คะแนนสุดท้าย</b></span><span class="v">${fin}</span></div>
    ${floor?`<div class="fl"><b>กฎพื้น:</b> หักแล้วเหลือ ${Math.round((raw-pen)*10)/10} ซึ่ง ≤ 0 → ให้ 1 คะแนน
      <span style="opacity:.8">(กฎนี้เดาไม่ได้ ต้องเขียนไว้ในระบบตรง ๆ)</span></div>`:""}
    <div class="dim" style="margin-top:6px">ทุกบรรทัดคำนวณจากสูตร ไม่มีใครพิมพ์ตัวเลขสุดท้ายเอง</div>
  </div>`;
}

function cellScore(gi,ci){
  const g = GROUPS[gi], w = W();
  if(g.st==="pending" || g.st==="toolate") return null;
  if(g.st==="fail" && ci>=w.criteria.length-2) return null;
  const c = w.criteria[ci], k = c.k||"level";
  const h = (gi*7+ci*3+S.work.length)%4;              /* 0..3 อ่อน→เข้ม */
  if(k==="level"){
    const lv = w.levels||LEVELS;
    return {v:lv[Math.round(h/3*(lv.length-1))].n, h:h+1};
  }
  return {v:Math.round(w.ai[c.id].full*(0.4+h*0.2)*2)/2, h:h+1};
}

        const sum = Math.round(row.reduce((a,b)=>a+(b?b.v:0),0)*10)/10;
        return `<tr><td class="name">${g.n}${g.flags.length?' <span class="pill warn" style="padding:0 5px;font-size:9.5px">▲</span>':""}</td>
        ${row.map((cell,ci)=>`<td><button class="sc ${cell?"h"+cell.h:""}" data-cell="${g.id}|${crits[ci].id}">
          ${cell?cell.v:'<span style="color:var(--ink-3);font-weight:400">—</span>'}
          ${g.flags.includes("blind")?'<span class="flag b"></span>':g.flags.length&&ci===1?'<span class="flag q"></span>':""}
        </button></td>`).join("")}
        <td><div class="sc">${g.st==="pending"||g.st==="toolate"?"0":sum}</div></td>
        <td><div class="sc" style="font-size:11px">${
          g.st==="done"?'<span class="pill teacher">ยืนยันแล้ว</span>':
          g.st==="fail"?'<span class="pill danger">ตรวจไม่สำเร็จ</span>':
          g.st==="toolate"?'<span class="pill danger">ช้าเกิน 3 วัน</span>':
          g.st==="pending"?'<span class="pill mute">ยังไม่ส่ง</span>':'<span class="pill ai">รอยืนยัน</span>'}</div></td></tr>`;
      }).join("")}</tbody></table></div>
    <div style="display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap">
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:9px;background:var(--ai)"></span> ชุด blind</span>
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:9px;background:var(--warn)"></span> คิวบังคับดู</span>
      <div class="spacer"></div><span>คลิกช่องใดก็ได้เพื่อเปิดหลักฐานและแก้คะแนน</span>
    </div>
    <div style="margin-top:14px;padding:12px;border:1px dashed var(--line-2);border-radius:var(--r);font-size:12.5px;color:var(--ink-2);max-width:80ch">
      <b style="color:var(--ink)">อ่านตารางนี้ตามคอลัมน์ ไม่ใช่ตามแถว</b> — คอลัมน์ที่สีเข้มเกือบทั้งคอลัมน์
      มักแปลว่า AI ตีความเกณฑ์ไม่ตรงกับที่คุณตั้งใจ มากกว่าจะแปลว่าทั้งชั้นทำไม่ได้จริง
    </div>
  </div>
  <div class="drawer${S.drawer?" on":""}">${S.drawer?`
    <div class="dh"><b>${gsel.n} · ${csel.id}</b><span class="dim">${esc(csel.t)}</span>
      <div class="spacer"></div><button class="btn sm" data-act="cprev">‹</button>
      <button class="btn sm" data-act="cnext">›</button><button class="btn sm" data-act="closedrawer">ปิด</button></div>
    <div class="db">${renderWork()}<div style="margin-top:12px">${critBlock(csel,true)}</div></div>`:""}
  </div></div>`;
}

/* ============================================================ */
const VARIANTS = {
  A:{name:"ห้องตรวจ — ชิ้นงานเป็นศูนย์กลาง", render:renderA},
  B:{name:"สายพาน — ไล่ทีละเกณฑ์ข้ามทั้งชั้น", render:renderB},
  C:{name:"แผงควบคุม — ตารางทั้งชั้นเป็นจุดตั้งต้น", render:renderC},
};
const KEYS = Object.keys(VARIANTS);

/* ล้างสิ่งที่ผู้ตรวจแตะไว้เมื่อย้ายกลุ่ม/ชิ้นงาน — prototype ไม่เก็บอะไรทั้งนั้น */
function reset(){ S.mine={}; S.chk={}; S.cnt={}; S.fb={}; S.activeEv=null; }

function render(){
  const w = W();
  if(!S.focusCrit || !w.ai[S.focusCrit]) S.focusCrit = w.criteria[1].id;
  if(!S.bCrit || !w.ai[S.bCrit]) S.bCrit = w.criteria[0].id;
  document.getElementById("root").innerHTML = VARIANTS[S.variant].render();
  document.getElementById("plabel").innerHTML = `${S.variant} <small>${VARIANTS[S.variant].name}</small>`;
}
function setVariant(v){
  S.variant=v; S.drawer=null;
  const u=new URL(location); u.searchParams.set("variant",v); history.replaceState({},"",u);
  render();
}

document.addEventListener("click",e=>{
  const t = e.target.closest("[data-g],[data-ev],[data-lv],[data-toggle],[data-act],[data-cell],[data-chk],[data-cnt],[data-fb]");
  if(!t) return;
  if(t.dataset.chk){ const k=t.dataset.chk, [cid,i]=k.split("|");
    S.chk[k] = !okOf(cid,+i); render(); return; }
  if(t.dataset.cnt){ const [cid,d]=t.dataset.cnt.split("|");
    S.cnt[cid] = Math.max(0, cntOf(cid)+ +d); render(); return; }
  if(t.dataset.fb){ const i=+t.dataset.fb, w=W();
    const cur = S.fb[i]!==undefined ? S.fb[i] : w.aiFb.includes(i);
    S.fb[i] = !cur; render(); return; }
  if(t.dataset.g){ S.group=t.dataset.g; render(); return; }
  if(t.dataset.cell){ const [g,c]=t.dataset.cell.split("|"); S.drawer={g,c}; S.focusCrit=c; S.activeEv=null; render(); return; }
  if(t.dataset.lv){ const cid=t.dataset.crit, lv=+t.dataset.lv;
    if(S.mine[cid]===lv) delete S.mine[cid]; else S.mine[cid]=lv; render(); return; }
  if(t.dataset.ev){ S.activeEv = S.activeEv===t.dataset.ev?null:t.dataset.ev;
    S.focusCrit = t.dataset.ev.split("|")[0]; render(); return; }
  if(t.dataset.toggle){ S.focusCrit = S.focusCrit===t.dataset.toggle?null:t.dataset.toggle; S.activeEv=null; render(); return; }
  const a = t.dataset.act;
  if(a==="blind"){ S.blind=!S.blind; render(); }
  if(a==="closedrawer"){ S.drawer=null; render(); }
  if(a==="bnext"){ S.bIndex=(S.bIndex+1)%13; reset(); render(); }
  if(a==="nextg"||a==="prevg"||a==="confirm"){
    const i=GROUPS.findIndex(g=>g.id===S.group);
    if(a==="confirm") GROUPS[i].st="done";
    S.group=GROUPS[(i+(a==="prevg"?-1:1)+GROUPS.length)%GROUPS.length].id;
    reset(); render();
  }
  if(a==="cnext"||a==="cprev"){
    const cs=W().criteria, i=cs.findIndex(c=>c.id===S.drawer.c);
    S.drawer.c = cs[(i+(a==="cnext"?1:-1)+cs.length)%cs.length].id;
    S.focusCrit=S.drawer.c; S.activeEv=null; render();
  }
});

document.addEventListener("change",e=>{
  if(e.target.id==="worksel"){ S.work=e.target.value; S.focusCrit=null; S.bCrit=null;
    S.drawer=null; reset(); render(); }
  if(e.target.id==="bcritsel"){ S.bCrit=e.target.value; S.bIndex=0; reset(); render(); }
});

document.getElementById("pv").onclick=()=>setVariant(KEYS[(KEYS.indexOf(S.variant)-1+KEYS.length)%KEYS.length]);
document.getElementById("nx").onclick=()=>setVariant(KEYS[(KEYS.indexOf(S.variant)+1)%KEYS.length]);

document.addEventListener("keydown",e=>{
  const ae = document.activeElement, tag = ae?ae.tagName:"";
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(ae&&ae.isContentEditable)) return;
  if(e.key==="ArrowLeft") document.getElementById("pv").click();
  if(e.key==="ArrowRight") document.getElementById("nx").click();
  if(S.variant==="B"){
    const scale = (W().levels||LEVELS).map(x=>String(x.n));
    if(scale.includes(e.key)){ S.mine[S.bCrit]=+e.key; render(); }
    if(e.key==="Enter"){ S.bIndex=(S.bIndex+1)%13; reset(); render(); }
  }
});

S.variant = new URL(location).searchParams.get("variant") || "A";
if(!KEYS.includes(S.variant)) S.variant="A";
render();
</script>
