<style>
/* ============================================================
   Wireframe ฝั่งอาจารย์ — ticket 19 · รอบที่ 3
   ตั้งใจให้เป็น "ความละเอียดต่ำ" ตามที่ ticket สั่ง: โครงกล่องและลำดับข้อมูล ไม่ลงสี
   สีที่ใช้มีสองชุดเท่านั้น และทั้งคู่เป็นเนื้อหา ไม่ใช่การตกแต่ง —
   สีหมุด = จุดที่ต้องตัดสินใจ · สีจุดสถานะ = สถานะการตรวจ ซึ่งอาจารย์ขอมาเอง
   ============================================================ */
:root{
  --bg:#FAF9F6; --panel:#FFFFFF; --sunk:#F2F0EA;
  --ink:#1B1A16; --ink2:#6B675D; --ink3:#9A9689;
  --line:#D5D2C8; --line2:#E9E6DE;
  --accent:#A8481A; --accent-bg:#F8EEE7; --accent-line:#E0BFAA;
  --ok:#3D6647; --warn:#8A6A1F; --stop:#8C3A2E;
  --mono:"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --ui:"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151519; --panel:#1C1C21; --sunk:#232329;
    --ink:#E9E6E0; --ink2:#9C978D; --ink3:#6C6860;
    --line:#33333A; --line2:#26262C;
    --accent:#E5A272; --accent-bg:#2B211B; --accent-line:#5A4335;
    --ok:#79A886; --warn:#C7A44E; --stop:#D08A7C;
  }
}
:root[data-theme="dark"]{
  --bg:#151519; --panel:#1C1C21; --sunk:#232329;
  --ink:#E9E6E0; --ink2:#9C978D; --ink3:#6C6860;
  --line:#33333A; --line2:#26262C;
  --accent:#E5A272; --accent-bg:#2B211B; --accent-line:#5A4335;
  --ok:#79A886; --warn:#C7A44E; --stop:#D08A7C;
}
:root[data-theme="light"]{
  --bg:#FAF9F6; --panel:#FFFFFF; --sunk:#F2F0EA;
  --ink:#1B1A16; --ink2:#6B675D; --ink3:#9A9689;
  --line:#D5D2C8; --line2:#E9E6DE;
  --accent:#A8481A; --accent-bg:#F8EEE7; --accent-line:#E0BFAA;
  --ok:#3D6647; --warn:#8A6A1F; --stop:#8C3A2E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.6;padding-bottom:64px}
h1,h2,h3{margin:0;font-weight:650;text-wrap:balance}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}

/* ---------- โครงหน้า ---------- */
.wrap{display:grid;grid-template-columns:228px minmax(0,1fr) 316px;gap:0;
  min-height:100vh;align-items:start}
@media(max-width:1080px){.wrap{grid-template-columns:1fr}}

/* ---------- รางซ้าย: การเดินทางของอาจารย์ ---------- */
.rail{border-right:1px solid var(--line);padding:20px 0 40px;position:sticky;top:0;
  align-self:start;max-height:100vh;overflow:auto}
@media(max-width:1080px){.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
.rail h1{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
  padding:0 18px;margin-bottom:14px}
.phase{padding:15px 18px 5px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);border-top:1px solid var(--line2);margin-top:8px}
.phase:first-of-type{border-top:0;margin-top:0}
.step{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:baseline;
  padding:7px 18px;cursor:pointer;border-left:2px solid transparent;color:var(--ink2)}
.step:hover{background:var(--sunk)}
.step.on{border-left-color:var(--accent);color:var(--ink);background:var(--sunk)}
.step .no{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.step.on .no{color:var(--accent)}
.step .tt{font-size:13px;line-height:1.35}
.step .rq{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.step .nw{display:inline-block;font-size:10px;border:1px solid var(--accent-line);
  color:var(--accent);padding:0 4px;margin-left:5px;vertical-align:1px}
.railnote{padding:16px 18px 0;margin-top:14px;border-top:1px solid var(--line2);
  font-size:11.5px;color:var(--ink3);line-height:1.65}

/* ---------- กลาง: ตัว wireframe ---------- */
.main{padding:24px 30px 60px;min-width:0}
.hd{margin-bottom:4px;font-size:19px}
.sub{color:var(--ink2);margin-bottom:20px;max-width:64ch}

.wf{background:var(--panel);border:1px solid var(--line);padding:0;overflow:hidden}
.wf + .wf{margin-top:18px}
.wfbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2);
  background:var(--sunk);font-size:12.5px;color:var(--ink2)}
.wfbar b{color:var(--ink);font-weight:600}
.wfbody{padding:16px}
.spacer{flex:1}

/* กล่องเปล่าแบบ wireframe */
.box{border:1px solid var(--line);padding:12px}
.dash{border:1px dashed var(--line)}
.ph{background:var(--line2);height:9px;border-radius:1px}
.ph.s{height:7px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.fld{border:1px solid var(--line);padding:7px 9px;font-size:13px;color:var(--ink2);background:transparent}
.fld.on{color:var(--ink);border-color:var(--ink3)}
.btnw{border:1px solid var(--line);padding:6px 12px;font-size:12.5px;color:var(--ink2);display:inline-block}
.btnw.pri{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip{border:1px solid var(--line);padding:2px 8px;font-size:11.5px;color:var(--ink2);border-radius:11px}
.chip.on{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink2);padding:7px 9px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.dim{color:var(--ink3);font-size:12px}
.hint{font-size:12px;color:var(--ink2);margin-top:9px;padding-left:11px;border-left:2px solid var(--line)}

/* หมุดจุดตัดสินใจ */
.pin{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 4px;border-radius:9px;background:var(--accent-bg);color:var(--accent);
  border:1px solid var(--accent-line);font-family:var(--mono);font-size:10.5px;
  cursor:pointer;vertical-align:middle;margin-left:5px;font-weight:600}
.pin:hover,.pin.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}

/* ---------- ขวา: จุดที่ต้องตัดสินใจ ---------- */
.notes{border-left:1px solid var(--line);padding:24px 20px 60px;position:sticky;top:0;
  align-self:start;max-height:100vh;overflow:auto}
@media(max-width:1080px){.notes{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
.notes h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:14px}
.note{padding:11px 12px;border:1px solid var(--line2);margin-bottom:10px;font-size:12.5px;line-height:1.6}
.note.on{border-color:var(--accent-line);background:var(--accent-bg)}
.note .nh{display:flex;gap:7px;align-items:baseline;margin-bottom:4px}
.note .nn{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:600}
.note .nt{font-weight:600}
.note .nb{color:var(--ink2)}
.note .src{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.note.settled{border-left:2px solid var(--ok)}
.note.settled .nn{color:var(--ok)}

/* ---------- จุดสถานะการตรวจ ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.wait{background:var(--warn)}
.dot.open{background:var(--accent)}
.dot.manual{background:transparent;border:1px solid var(--ink3)}
.dot.none{background:transparent;border:1px dashed var(--line)}
tr.unset td{background:repeating-linear-gradient(135deg,transparent,transparent 5px,
  var(--line2) 5px,var(--line2) 6px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line2)}

/* ---------- ตารางสิทธิ์ ---------- */
.perm{width:100%;border-collapse:collapse;font-size:12.5px}
.perm th{text-align:left;font-weight:600;color:var(--ink2);padding:7px 9px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.perm th.c,.perm td.c{text-align:center;width:96px}
.perm td{padding:7px 9px;border-bottom:1px solid var(--line2)}
.perm .y{color:var(--ok);font-weight:650}
.perm .n{color:var(--stop);font-weight:650}
.perm tr:last-child td{border-bottom:0}

/* ---------- rubric variants ---------- */
.rgrid{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);font-size:11.5px}
.rgrid > div{background:var(--panel);padding:7px 8px}
.rgrid .rh{background:var(--sunk);font-weight:600;font-size:10.5px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink2)}
.rgrid .rc{color:var(--ink2);line-height:1.5}
.rgrid .rc.empty{color:var(--ink3);font-style:italic}
.wizstep{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.wizstep .ws{border:1px solid var(--line);padding:3px 9px;font-size:11.5px;color:var(--ink3)}
.wizstep .ws.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.wizstep .ws.done{color:var(--ink2)}
.exthumb{border:1px solid var(--line);height:64px;display:flex;align-items:center;
  justify-content:center;font-size:19px;background:var(--sunk)}

/* ---------- แถบล่าง ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:9px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.bar b{font-weight:650}
.bar .vb{border:1px solid var(--line);padding:4px 11px;cursor:pointer;color:var(--ink2);
  background:transparent;font-family:inherit;font-size:12.5px}
.bar .vb.on{border-color:var(--ink);color:var(--ink);font-weight:650}
.bar .k{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line2);
  padding:1px 5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.note{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>
  <aside class="notes" id="notes"></aside>
</div>
<div class="bar" id="bar"></div>

<script>
/* ============================================================
   ข้อมูลตัวอย่าง — วิชา UX/UI ภาค 1/2569
   รอบที่ 3 — หลังอาจารย์ตอบคำถามครบทั้ง 6 ข้อ (6 ส.ค. 69)
   ============================================================ */
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = n=>`<span class="pin" data-pin="${n}">${n}</span>`;
const ph = (w,c)=>`<div class="ph ${c||""}" style="width:${w}"></div>`;
const dot = (k,txt)=>`<span class="st"><span class="dot ${k}"></span>${esc(txt)}</span>`;

const S = {i:0, variant:"B", pin:null};

/* ============================================================
   01 — รายวิชาทั้งหมด
   ============================================================ */
const SC1 = {
  t:"รายวิชาของฉัน", phase:"ก่อนเปิดเทอม",
  sub:"จุดเริ่มต้นของทุกเทอม คำถามที่หน้าจอนี้ต้องตอบให้ได้คือ “เปิดเทอมใหม่แล้วต้องกรอกอะไรใหม่บ้าง”",
  rq:"โจทย์ข้อ 1, 3, 14",
  body:()=>`
  <div class="wf">
    <div class="wfbar"><b>รายวิชาของฉัน</b><div class="spacer"></div>
      <span class="chip on">1/2569</span><span class="chip">2/2569</span>
      <span class="chip">ทั้งหมด</span>${P(1)}</div>
    <div class="wfbody">
      <div class="scroll"><table class="tbl">
        <tr><th>รหัส / ชื่อวิชา</th><th>ภาค</th><th class="num">นศ.</th><th class="num">กิจกรรมประเมิน</th>
          <th>สถานะ</th><th></th></tr>
        <tr><td><b>06016315</b> · การออกแบบส่วนติดต่อผู้ใช้</td><td>1/2569</td><td class="num">48</td>
          <td class="num">21</td><td>กำลังสอน</td><td><span class="btnw">เปิด</span></td></tr>
        <tr><td><b>06016315</b> · การออกแบบส่วนติดต่อผู้ใช้</td><td>2/2568</td><td class="num">44</td>
          <td class="num">19</td><td>ปิดแล้ว</td>
          <td><span class="btnw">คัดลอกไปเทอมใหม่</span>${P(2)}</td></tr>
        <tr><td>${ph("62%")}</td><td>${ph("70%","s")}</td><td>${ph("50%","s")}</td>
          <td>${ph("50%","s")}</td><td>${ph("70%","s")}</td><td></td></tr>
      </table></div>
      <div class="row" style="margin-top:14px">
        <span class="btnw pri">+ สร้างรายวิชาใหม่</span>
        <span class="dim">หรือคัดลอกจากเทอมก่อนเพื่อไม่ต้องตั้งค่าใหม่ทั้งหมด</span>
      </div>
    </div>
  </div>

  <div class="wf">
    <div class="wfbar"><b>คัดลอก 06016315 · 2/2568 → 1/2569</b><span class="dim">— ป๊อปอัป</span>
      <div class="spacer"></div><span class="chip on">โจทย์ข้อ 14 · รับเข้าแล้ว</span></div>
    <div class="wfbody">
      <div class="lbl">คัดลอกไป — โครงของวิชา</div>
      <div class="row" style="margin-bottom:10px">
        <span class="chip on">✓ CLO ทั้ง 5 ข้อ และการผูก PLO</span>
        <span class="chip on">✓ rubric ทั้ง 12 ชุด</span>
        <span class="chip on">✓ ตารางสัปดาห์ · หัวข้อ + กิจกรรมประเมิน</span>
        <span class="chip on">✓ สัดส่วนคะแนนและเกณฑ์ตัดเกรด</span>
      </div>
      <div class="lbl">คัดลอกไป — ของที่สะสมมาทั้งเทอมที่แล้ว${P(3)}</div>
      <div class="row" style="margin-bottom:10px">
        <span class="chip on">✓ ตัวอย่างงาน 🥇🥈🥉 ที่ปักไว้</span>
        <span class="chip on">✓ ผลการปรับจูน AI ทั้งเทอม</span>
        <span class="chip on">✓ คลังประโยค feedback</span>
      </div>
      <div class="lbl">ไม่คัดลอก</div>
      <div class="row">
        <span class="chip">✕ รายชื่อนักศึกษา</span>
        <span class="chip">✕ งานที่ส่ง และคะแนนทั้งหมด</span>
        <span class="chip">✕ รายชื่อ TA</span>
        <span class="chip">✕ <b>วันกำหนดส่ง — ล้างทั้งหมด</b>${P(4)}</span>
      </div>
      <div class="hint">rubric ที่คัดลอกมาเป็น <b>เวอร์ชันใหม่ที่แยกจากของเดิม</b> ไม่ใช่ตัวเดียวกัน —
        แก้ในเทอมนี้ต้องไม่กระทบคะแนนที่ตรวจไปแล้วในเทอมก่อน</div>
    </div>
  </div>`,
  notes:[
    {t:"ภาคการศึกษาเป็นตัวกรอง ไม่ใช่โฟลเดอร์",
     b:"ถ้าทำเป็นโฟลเดอร์ อาจารย์จะเทียบข้ามเทอมไม่ได้ ซึ่งเป็นสิ่งที่ต้องทำแน่ ๆ ตอนดูว่าเกณฑ์เข้มขึ้นหรือหลวมลง",
     src:"โจทย์ข้อ 3"},
    {t:"“คัดลอกไปเทอมใหม่” รับเป็นโจทย์ข้อใหม่แล้ว", settled:true,
     b:"ถ้าไม่มี อาจารย์ต้องกรอก CLO 5 ข้อ + rubric 12 ชุด ใหม่ทุกเทอม ซึ่งเป็นเหตุผลที่คนเลิกใช้ระบบแบบนี้ — อาจารย์รับเข้าเป็นฟีเจอร์เมื่อ 6 ส.ค. 69 จึงกลายเป็นโจทย์ข้อที่ 14",
     src:"เพิ่มจากโจทย์ 13 ข้อเดิม"},
    {t:"ตัดสินแล้ว: การปรับจูน AI ข้ามเทอมไปด้วย", settled:true,
     b:"อาจารย์เลือกให้คัดลอกทั้งตัวอย่างงานที่ปักไว้ ผลการปรับจูน และคลังประโยค feedback — แปลว่าระบบสะสมความรู้ข้ามเทอมได้จริง แต่ตามมาด้วยข้อบังคับฝั่งวิจัย: เทอมที่ 2 ต้องวัดเทียบกับ “ตัวที่ยกมา” ไม่ใช่ตัวเปล่า และชุดทดสอบของเทอมใหม่ต้องเป็นงานที่ระบบไม่เคยเห็น",
     src:"อาจารย์ตอบ 6 ส.ค. 69 · กระทบ ticket 15, 16"},
    {t:"ตัดสินแล้ว: กำหนดส่งถูกล้างทิ้งเสมอ", settled:true,
     b:"ปฏิทินแต่ละเทอมไม่ตรงกัน วันที่จากเทอมก่อนจึงผิดแน่นอน 100% การคัดลอกวันมาแล้วให้อาจารย์ไล่แก้ อันตรายกว่าการเว้นว่างไว้ เพราะวันที่ผิดที่ดูเหมือนถูกจะไม่มีใครทันสังเกต",
     src:"ผลจากการตัดสินเรื่องคัดลอก"},
  ]
};

/* ============================================================
   02 — ตั้งค่ารายวิชา (หน้าจอใหม่ · อาจารย์ขอมา)
   ============================================================ */
const SC2 = {
  t:"ตั้งค่ารายวิชา", isNew:true,
  sub:"หน้าที่หายไปทั้งหน้าใน wireframe รอบก่อน — เป็นที่อยู่ของค่าระดับวิชาที่หน้าจออื่นทั้งหมดยืมไปใช้",
  rq:"โจทย์ข้อ 1, 11",
  body:()=>`
  <div class="wf">
    <div class="wfbar"><b>สัดส่วนคะแนนของรายวิชา</b><div class="spacer"></div>
      <span class="chip on">รวม 100%</span>${P(1)}</div>
    <div class="wfbody">

const SCREENS = [SC1,SC2,SC3,SC4,SC5,SC6,SC7,SC8,SC9,SC10];
const VKEYS = Object.keys(RVARIANTS);

/* ============================================================ render */
function renderRail(){
  return `<h1>การเดินทางของอาจารย์</h1>` + SCREENS.map((s,i)=>`
    ${s.phase?`<div class="phase">${esc(s.phase)}</div>`:""}
    <div class="step ${i===S.i?"on":""}" data-sc="${i}" tabindex="0" role="button">
      <span class="no">${String(i+1).padStart(2,"0")}</span>
      <span class="tt">${esc(s.t)}${s.isNew?'<span class="nw">ใหม่</span>':""}
        <span class="rq">${esc(s.rq)}</span></span>
    </div>`).join("") + `
    <div class="railnote">รอบที่ 3 — หลังอาจารย์ตอบคำถามครบ 6 ข้อ เมื่อ 6 ส.ค. 69
      <br><br>สี่หน้าจอที่ทำเครื่องหมาย <b>ใหม่</b> คือหน้าที่อาจารย์ระบุเองว่าหายไป
      <br><br>เอกสาร course description และ มคอ.3 ใช้เป็นวัตถุดิบของ <b>ขั้น 05 CLO เท่านั้น</b> —
      ตารางสัปดาห์อาจารย์กรอกเองและคัดลอกจากเทอมก่อน</div>`;
}
function renderMain(){
  const s = SCREENS[S.i];
  return `<h1 class="hd">${String(S.i+1).padStart(2,"0")} · ${esc(s.t)}</h1>
    <p class="sub">${esc(s.sub)}</p>${s.body()}`;
}
function renderNotes(){
  const s = SCREENS[S.i];
  return `<h2>จุดที่ต้องตัดสินใจ</h2>` + s.notes.map((n,i)=>`
    <div class="note ${n.settled?"settled":""} ${S.pin===i+1?"on":""}" data-note="${i+1}">
      <div class="nh"><span class="nn">${i+1}</span><span class="nt">${esc(n.t)}</span></div>
      <div class="nb">${esc(n.b)}</div>
      <span class="src">${esc(n.src)}</span>
    </div>`).join("");
}
function renderBar(){
  const s = SCREENS[S.i];
  const on = !!s.variants;
  return `<b>${String(S.i+1).padStart(2,"0")}</b> <span class="dim">${esc(s.t)}</span>
    <span class="k">↑ ↓ เปลี่ยนหน้าจอ</span>
    <div class="spacer"></div>
    ${on ? VKEYS.map(k=>`<button class="vb ${k===S.variant?"on":""}" data-v="${k}">${k} · ${esc(RVARIANTS[k].name)}</button>`).join("")
         : `<span class="dim">หน้าจอนี้มีแบบเดียว — สองโหมดอยู่ที่หน้าจอ 08 สร้าง rubric</span>`}
    ${on ? `<span class="k">← → สลับโหมด</span>` : ""}
    ${on ? `<span class="dim" style="flex-basis:100%;padding-top:4px">${esc(RVARIANTS[S.variant].unit)}</span>` : ""}`;
}
function render(){
  document.getElementById("rail").innerHTML  = renderRail();
  document.getElementById("main").innerHTML  = renderMain();
  document.getElementById("notes").innerHTML = renderNotes();
  document.getElementById("bar").innerHTML   = renderBar();
}

/* ============================================================ events */
function go(i){ S.i=(i+SCREENS.length)%SCREENS.length; S.pin=null; render(); window.scrollTo(0,0); }
function setVariant(v){
  S.variant=v;
  const u=new URL(location); u.searchParams.set("variant",v); history.replaceState({},"",u);
  render();
}
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-sc]");   if(st){ go(+st.dataset.sc); return; }
  const vb=e.target.closest("[data-v]");    if(vb){ setVariant(vb.dataset.v); return; }
  const pn=e.target.closest("[data-pin]");  if(pn){
    S.pin=+pn.dataset.pin; render();
    const el=document.querySelector(`[data-note="${S.pin}"]`);
    if(el) el.scrollIntoView({block:"nearest"});
    return;
  }
  const nt=e.target.closest("[data-note]"); if(nt){ S.pin=+nt.dataset.note; render(); }
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable)) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); go(S.i+1); }
  if(e.key==="ArrowUp"){   e.preventDefault(); go(S.i-1); }
  if(!SCREENS[S.i].variants) return;
  if(e.key==="ArrowRight") setVariant(VKEYS[(VKEYS.indexOf(S.variant)+1)%VKEYS.length]);
  if(e.key==="ArrowLeft")  setVariant(VKEYS[(VKEYS.indexOf(S.variant)-1+VKEYS.length)%VKEYS.length]);
});

S.variant = new URL(location).searchParams.get("variant") || "B";
if(!VKEYS.includes(S.variant)) S.variant="B";
render();
</script>
