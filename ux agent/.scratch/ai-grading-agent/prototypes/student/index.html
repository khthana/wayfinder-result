.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.note{transition:background .12s,border-color .12s}}

const SCREENS = [SC1,SC2,SC3,SC4,SC5,SC6,SC7];

function renderRail(){
  return `<h1>การเดินทางของนักศึกษา</h1>` + SCREENS.map((s,i)=>`
    ${s.phase && (i===0 || SCREENS[i-1].phase!==s.phase)?`<div class="phase">${esc(s.phase)}</div>`:""}
    <div class="step ${i===S.i?"on":""}" data-sc="${i}" tabindex="0" role="button">
      <span class="no">${String(i+1).padStart(2,"0")}</span>
      <span class="tt">${esc(s.t)}${s.isNew?'<span class="nw">สำคัญ</span>':""}
        <span class="rq">${esc(s.rq)}</span></span>
    </div>`).join("") + `
    <div class="railnote">รอบที่ 1 — หลังอาจารย์ตอบคำถามนโยบาย 4 ข้อ เมื่อ 7 ส.ค. 69
      <br><br>สองหน้าที่ทำเครื่องหมาย <b>สำคัญ</b> คือหน้าที่ความผิดพลาดจะกลายเป็นงานของอาจารย์
      <br><br>ใช้ CSS ชุดเดียวกับ wireframe ฝั่งอาจารย์โดยตั้งใจ — สองฝั่งเป็นระบบเดียวกัน</div>`;
}
function renderMain(){
  const s = SCREENS[S.i];
  return `<h1 class="hd">${String(S.i+1).padStart(2,"0")} · ${esc(s.t)}</h1>
    <p class="sub">${esc(s.sub)}</p>${s.body()}`;
}
function renderNotes(){
  const s = SCREENS[S.i];
  return `<h2>จุดที่ต้องตัดสินใจ</h2>` + s.notes.map((n,i)=>`
    <div class="note ${n.settled?"settled":""} ${S.pin===i+1?"on":""}" data-note="${i+1}">
      <div class="nh"><span class="nn">${i+1}</span><span class="nt">${esc(n.t)}</span></div>
      <div class="nb">${esc(n.b)}</div>
      <span class="src">${esc(n.src)}</span>
    </div>`).join("");
}
function renderBar(){
  const s = SCREENS[S.i];
  return `<b>${String(S.i+1).padStart(2,"0")}</b> <span class="dim">${esc(s.t)}</span>
    <span class="k">↑ ↓ เปลี่ยนหน้าจอ</span>
    <div class="spacer"></div>
    <span class="dim">หมุดสีในหน้าจอ = จุดที่ต้องตัดสินใจ กดแล้วกระโดดไปที่บันทึกด้านขวา</span>`;
}
function render(){
  document.getElementById("rail").innerHTML  = renderRail();
  document.getElementById("main").innerHTML  = renderMain();
  document.getElementById("notes").innerHTML = renderNotes();
  document.getElementById("bar").innerHTML   = renderBar();
}

/* ============================================================ events */
function go(i){ S.i=(i+SCREENS.length)%SCREENS.length; S.pin=null; render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-sc]");   if(st){ go(+st.dataset.sc); return; }
  const pn=e.target.closest("[data-pin]");  if(pn){
    S.pin=+pn.dataset.pin; render();
    const el=document.querySelector(`[data-note="${S.pin}"]`);
    if(el) el.scrollIntoView({block:"nearest"});
    return;
  }
  const nt=e.target.closest("[data-note]"); if(nt){ S.pin=+nt.dataset.note; render(); }
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable)) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); go(S.i+1); }
  if(e.key==="ArrowUp"){   e.preventDefault(); go(S.i-1); }
});

render();
</script>
